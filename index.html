<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="火火单词">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>火火单词 · 音乐英语</title>
<style>
:root{
  --bg:#0d1020; --bg2:#12152c; --card:#1b2040; --card2:#232a50;
  --text:#eef0fb; --muted:#9aa0c0; --faint:#6b7196;
  --accent:#7c6cff; --accent2:#a78bfa;
  --good:#34d399; --bad:#f87171; --warn:#fbbf24;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.16);
  --radius:18px;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text",Segoe UI,Roboto,sans-serif;
  color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(124,108,255,.28), transparent 60%),
    radial-gradient(700px 500px at -10% 20%, rgba(167,139,250,.16), transparent 55%),
    radial-gradient(600px 400px at 50% 110%, rgba(251,146,60,.10), transparent 60%);
  background-attachment:fixed;
  min-height:100dvh; -webkit-user-select:none; user-select:none;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* ===== 顶部 ===== */
header{padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 16px rgba(124,108,255,.4)}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
.brand p{margin:0;font-size:11px;color:var(--muted);margin-top:1px}
.streak{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);
  padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:#ffd58a}

/* ===== 主内容 ===== */
main{flex:1;padding:8px 20px 16px;display:flex;flex-direction:column}

/* ===== 顶栏(返回) ===== */
.topbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.backbtn{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.backbtn:active{opacity:.7}
.topbar .t{font-size:16px;font-weight:700;flex:1;text-align:center;margin-right:70px}

/* ===== 概览/菜单 ===== */
.overview{display:flex;gap:10px;margin:6px 0 16px}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat .num{font-size:24px;font-weight:800;line-height:1}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px}
.stat .num.accent{color:var(--accent2)}
.menu-card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border2);
  border-radius:24px;padding:26px;box-shadow:var(--shadow);margin-top:6px}
.menu-card h2{margin:0 0 6px;font-size:20px}
.menu-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px}
.btn{display:block;width:100%;border:1px solid var(--border2);background:var(--card2);color:var(--text);
  border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;transition:.15s}
.btn:active{opacity:.8}
.btn.warn{color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:11px;font-size:14px}

/* ===== 题目卡片 ===== */
.qcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border2);
  border-radius:24px;padding:26px 22px;box-shadow:var(--shadow)}
.qword{font-size:34px;font-weight:800;text-align:center;letter-spacing:.5px;line-height:1.2;word-break:break-word;margin:8px 0 4px}
.qipa{font-size:15px;color:var(--muted);text-align:center;margin-bottom:6px}
.qzh{font-size:24px;font-weight:800;color:var(--accent2);text-align:center;line-height:1.4;margin:8px 0 4px}
.speakrow{display:flex;justify-content:center;margin:6px 0}
.speak{width:44px;height:44px;border-radius:50%;border:1px solid var(--border2);background:rgba(124,108,255,.14);
  color:var(--accent2);font-size:19px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.speak:active{transform:scale(.92)}
.qhint{text-align:center;font-size:12px;color:var(--faint);margin-top:4px}
.qphase{text-align:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:10px}

/* ===== 选项 A/B/C/D ===== */
.options{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.option{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--border);
  border-radius:14px;padding:15px 16px;font-size:15px;cursor:pointer;transition:.15s;text-align:left;width:100%;color:var(--text)}
.option .key{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--border2);
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.option .val{flex:1}
.option:active{transform:scale(.98)}
.option.correct{background:rgba(52,211,153,.16);border-color:var(--good)}
.option.correct .key{background:var(--good);color:#0d1020;border-color:var(--good)}
.option.wrong{background:rgba(248,113,113,.16);border-color:var(--bad)}
.option.wrong .key{background:var(--bad);color:#0d1020;border-color:var(--bad)}

/* ===== 拼写 ===== */
.spellbox{display:flex;gap:10px;margin-top:18px}
.spellbox input{flex:1;background:var(--card);border:1.5px solid var(--border2);border-radius:14px;
  padding:15px 16px;font-size:18px;color:var(--text);outline:none;letter-spacing:1px;text-align:center;font-weight:700}
.spellbox input:focus{border-color:var(--accent)}
.spellbox input.ok{border-color:var(--good);background:rgba(52,211,153,.12)}
.spellbox input.no{border-color:var(--bad);background:rgba(248,113,113,.12)}
.submitbtn{flex:0 0 auto;background:var(--accent);border:none;color:#fff;border-radius:14px;padding:0 22px;
  font-size:15px;font-weight:700;cursor:pointer}
.feedback{margin-top:12px;font-size:14px;font-weight:700;text-align:center;min-height:20px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}

/* ===== 解释页 ===== */
.explain{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border2);
  border-radius:24px;padding:24px 22px;box-shadow:var(--shadow)}
.explain .zh{font-size:22px;font-weight:800;color:var(--accent2);text-align:center;line-height:1.4;margin:10px 0 14px}
.detail{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:12px}
.detail .k{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1px;margin-bottom:3px;display:block}
.example{font-size:13.5px;line-height:1.65;color:var(--muted);background:rgba(255,255,255,.03);
  border-radius:12px;padding:12px 14px;margin-bottom:14px}
.wrongnote{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fca5a5;
  border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:center}
.rightnote{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7;
  border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:center}
.answerline{text-align:center;font-size:16px;margin-bottom:6px}
.answerline b{color:var(--accent2);font-size:20px;letter-spacing:1px}

/* ===== 完成态 ===== */
.done{text-align:center;padding:30px 10px}
.done .emoji{font-size:56px;margin-bottom:14px}
.done h2{margin:0 0 8px;font-size:22px}
.done p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px}

/* ===== 单词本 ===== */
.searchbar{display:flex;gap:8px;margin:6px 0 12px}
.searchbar input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:11px 14px;font-size:14px;color:var(--text);outline:none}
.searchbar input::placeholder{color:var(--faint)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:.15s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.worditem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:13px 16px;cursor:pointer;transition:.15s}
.worditem:active{background:var(--card2)}
.worditem .w{font-size:16px;font-weight:700;flex:1;word-break:break-word}
.worditem .z{font-size:12px;color:var(--muted);text-align:right;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.worditem .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.new{background:var(--faint)} .dot.learn{background:var(--warn)} .dot.review{background:var(--accent2)} .dot.master{background:var(--good)}
.empty{text-align:center;color:var(--faint);padding:40px 0;font-size:14px}

/* ===== 我的 ===== */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.panel h3{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.setting{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.setting .lbl{font-size:14px}
.setting .val{display:flex;gap:7px}
.seg{border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:10px;padding:6px 12px;
  font-size:13px;color:var(--muted);cursor:pointer}
.seg.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== 底部导航 ===== */
nav{display:flex;border-top:1px solid var(--border);background:rgba(13,16,32,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;
  padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--accent2)}
nav button .badge{position:absolute;transform:translate(14px,-4px);background:var(--bad);color:#fff;
  font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.navbtn{position:relative}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">🔥</div>
      <div><h1>火火单词</h1><p>音乐制作 · 英语词汇</p></div>
    </div>
    <div class="streak">🔥 <span id="streakNum">0</span> 天</div>
  </header>
  <main id="main"></main>
  <nav>
    <button class="navbtn on" data-tab="study"><span class="ic">📖</span>学习<span class="badge" id="badgeStudy" style="display:none"></span></button>
    <button class="navbtn" data-tab="list"><span class="ic">📚</span>单词本</button>
    <button class="navbtn" data-tab="me"><span class="ic">👤</span>我的</button>
  </nav>
</div>

<script src="words.js"></script>
<script>
"use strict";
const WORDS = window.WORDS || [];
const CATS = ["全部","打击乐","键盘","吉他","合成器","人声","管乐","音效","其他"];
const LS_KEY = "huohuo-words-progress-v1";

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function $(s){return document.querySelector(s);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 进度持久化 ---------- */
let progress = load();
function load(){try{const p=JSON.parse(localStorage.getItem(LS_KEY));if(p&&p.cards)return p;}catch(e){}return {cards:{},settings:{dailyNew:10},stats:{}};}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(progress));}
function bumpStreak(){const s=progress.stats;const t=todayStr();if(s.lastDay===t)return;const y=addDays(t,-1);s.streak=(s.lastDay===y?(s.streak||0)+1:1);s.lastDay=t;}
function cardState(w){const c=progress.cards[w.word];if(!c)return "new";if(c.interval===0)return "learn";if(c.due&&c.due<=todayStr())return "review";if(c.interval>=21)return "master";return "review";}
function pickNew(n){return WORDS.filter(w=>!progress.cards[w.word]).slice(0,n||0);}
function pickDue(){const t=todayStr();return WORDS.filter(w=>{const c=progress.cards[w.word];return c&&c.due&&c.due<=t;});}

/* ---------- 语音 ---------- */
let voices=[];
function initVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));}
if("speechSynthesis" in window){initVoices();speechSynthesis.onvoiceschanged=initVoices;}
function speak(word){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=0.9;const en=voices.find(v=>v.lang==="en-US")||voices[0];if(en)u.voice=en;speechSynthesis.speak(u);}

/* ---------- 学习会话状态机 ---------- */
let session=null;
function renderStudy(){renderMenu();}
function renderMenu(){
  const limit=progress.settings.dailyNew||10;
  const newN=pickNew(limit).length, dueN=pickDue().length;
  $("#streakNum").textContent=progress.stats.streak||0;
  if(newN===0 && dueN===0){renderDone();return;}
  $("#main").innerHTML=`
    <div class="overview">
      <div class="stat"><div class="num">${newN}</div><div class="lbl">今日新词</div></div>
      <div class="stat"><div class="num accent">${dueN}</div><div class="lbl">待复习</div></div>
      <div class="stat"><div class="num">${mastered()}</div><div class="lbl">已掌握</div></div>
    </div>
    <div class="menu-card">
      <h2>${newN>0?"今天学 ${newN} 个新词":"今日无新词，复习 ${dueN} 个"}</h2>
      <p>新词用选择题学，学完进入拼写复习；拼错的词会反复出现，直到你全拼对。</p>
      <button class="btn primary" onclick="beginSession()">开始学习</button>
    </div>`;
  updateBadge();
}
function mastered(){return WORDS.filter(w=>{const c=progress.cards[w.word];return c&&c.interval>=21;}).length;}

function beginSession(){
  const limit=progress.settings.dailyNew||10;
  const newWords=pickNew(limit);
  const due=pickDue();
  session={mcqQueue:[...newWords],spellQueue:[...due,...newWords],failQueue:[],current:null,wordWrong:false,addedToFail:false};
  if(newWords.length>0)renderMCQ();
  else renderSpellIntro();
}

/* ===== 选择题（学习新词） ===== */
function renderMCQ(){
  if(session.mcqQueue.length===0){renderSpellIntro();return;}
  const w=session.mcqQueue[0];session.current=w;session.wordWrong=false;
  const opts=buildOptions(w);
  const keys="ABCD";
  $("#main").innerHTML=`
    <div class="qphase">· 学习新词 ·</div>
    <div class="qcard">
      <div class="qword" id="qword">${esc(w.word)}</div>
      <div class="qipa">${w.ipa?"/"+esc(w.ipa)+"/":""}</div>
      <div class="speakrow"><button class="speak" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}')">🔊</button></div>
      <div class="qhint">选出正确的中文意思</div>
      <div class="options" id="opts">${opts.map((o,i)=>`
        <button class="option" data-i="${i}" onclick="answerMCQ(${i})">
          <span class="key">${keys[i]}</span><span class="val">${esc(o)}</span>
        </button>`).join("")}</div>
    </div>`;
}
function buildOptions(w){
  const correct=w.zh;
  const pool=WORDS.filter(x=>x.word!==w.word&&x.zh&&x.zh!==correct);
  const diff=shuffle(pool.filter(x=>x.category!==w.category));
  const same=shuffle(pool.filter(x=>x.category===w.category));
  const distractors=[...diff,...same].slice(0,3).map(x=>x.zh);
  return shuffle([correct,...distractors]);
}
function answerMCQ(i){
  const w=session.current;
  const optsEl=document.querySelectorAll(".option");
  const correctText=w.zh;
  let correctIdx=-1;
  optsEl.forEach((el,idx)=>{if(el.querySelector(".val").textContent===correctText)correctIdx=idx;});
  if(i===correctIdx){
    optsEl[i].classList.add("correct");
    setTimeout(()=>{session.mcqQueue.shift();renderExplain(false);},350);
  }else{
    session.wordWrong=true;
    optsEl[i].classList.add("wrong");
    optsEl[correctIdx].classList.add("correct");
    setTimeout(()=>{session.mcqQueue.shift();renderExplain(true);},950);
  }
}

/* ===== 解释页 ===== */
function renderExplain(wrong){
  const w=session.current;
  $("#main").innerHTML=`
    <div class="qphase">· 学习新词 ·</div>
    <div class="explain">
      ${wrong?'<div class="wrongnote">⚠️ 刚才选错了，记住它</div>':'<div class="rightnote">✓ 回答正确</div>'}
      <div class="qword" style="font-size:28px">${esc(w.word)}</div>
      <div class="qipa">${w.ipa?"/"+esc(w.ipa)+"/":""}</div>
      <div class="speakrow"><button class="speak" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}')">🔊</button></div>
      <div class="zh">${esc(w.zh)}</div>
      <div class="detail"><span class="k">定义</span>${esc(w.def||"")}</div>
      ${w.example?`<div class="example"><span class="k" style="color:var(--muted);font-size:12px">🎧 例子</span>${esc(w.example)}</div>`:""}
      <button class="btn primary" onclick="nextExplain()">下一个</button>
    </div>`;
}
function nextExplain(){renderMCQ();}

/* ===== 拼写复习 ===== */
function renderSpellIntro(){
  $("#main").innerHTML=`
    <div class="done" style="padding-top:60px">
      <div class="emoji">✍️</div>
      <h2>进入复习</h2>
      <p>看中文意思，拼写出正确的英文单词<br>拼错的会反复出现，直到全会</p>
      <button class="btn primary" onclick="startSpell()">开始复习</button>
    </div>`;
}
function startSpell(){
  if(session.spellQueue.length===0){
    if(session.failQueue.length>0){session.spellQueue=[...session.failQueue];session.failQueue=[];}
    else {renderDone();return;}
  }
  session.current=session.spellQueue[0];
  session.wordWrong=false;session.addedToFail=false;
  renderSpell();
}
function renderSpell(){
  const w=session.current;
  $("#main").innerHTML=`
    <div class="qphase">· 拼写复习 ·</div>
    <div class="qcard">
      <div class="qzh">${esc(w.zh)}</div>
      <div class="qipa" style="color:var(--muted)">${w.category||""}</div>
      <div class="speakrow"><button class="speak" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}')">🔊</button></div>
      <div class="qhint">拼出这个单词的英文</div>
      <div class="spellbox">
        <input id="spellInput" type="text" autocapitalize="none" autocorrect="off" spellcheck="false"
               placeholder="输入英文…" onkeydown="if(event.key==='Enter')submitSpell()">
        <button class="submitbtn" onclick="submitSpell()">提交</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  const inp=$("#spellInput");if(inp)inp.focus();
}
function submitSpell(){
  const w=session.current;
  const inp=$("#spellInput");
  const val=(inp.value||"").trim();
  if(!val)return;
  if(val.toLowerCase()===w.word.toLowerCase()){
    inp.classList.add("ok");
    const fb=$("#fb");fb.textContent="✓ 正确！"+w.word;fb.className="feedback ok";
    updateSRS(w,!session.wordWrong);
    setTimeout(()=>{session.spellQueue.shift();nextSpell();},600);
  }else{
    if(!session.addedToFail){session.failQueue.push(w);session.addedToFail=true;}
    session.wordWrong=true;
    inp.classList.add("no");
    const fb=$("#fb");fb.textContent="✗ 不对";fb.className="feedback no";
    setTimeout(renderSpellExplain,700);
  }
}
function nextSpell(){
  if(session.spellQueue.length===0&&session.failQueue.length>0){session.spellQueue=[...session.failQueue];session.failQueue=[];}
  if(session.spellQueue.length===0){renderDone();return;}
  session.current=session.spellQueue[0];
  session.wordWrong=false;session.addedToFail=false;
  renderSpell();
}
function renderSpellExplain(){
  const w=session.current;
  $("#main").innerHTML=`
    <div class="qphase">· 拼写复习 ·</div>
    <div class="explain">
      <div class="wrongnote">✗ 正确答案：</div>
      <div class="answerline"><b>${esc(w.word)}</b>　${w.ipa?"/"+esc(w.ipa)+"/":""}</div>
      <div class="zh">${esc(w.zh)}</div>
      <div class="detail"><span class="k">定义</span>${esc(w.def||"")}</div>
      ${w.example?`<div class="example"><span class="k" style="color:var(--muted);font-size:12px">🎧 例子</span>${esc(w.example)}</div>`:""}
      <div class="speakrow"><button class="speak" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}')">🔊</button></div>
      <button class="btn primary" onclick="retrySpell()">再拼一次</button>
    </div>`;
}
function retrySpell(){renderSpell();}

function updateSRS(w,correctFirstTry){
  let c=progress.cards[w.word]||{interval:0,ease:2.5,reps:0,due:null,lapses:0};
  const t=todayStr();
  if(correctFirstTry){
    if(c.reps===0)c.interval=1;else if(c.reps===1)c.interval=3;else if(c.reps===2)c.interval=7;else c.interval=Math.round(c.interval*c.ease);
    c.ease=Math.min(3,c.ease+0.05);c.reps=(c.reps||0)+1;c.due=addDays(t,c.interval);
  }else{
    c.interval=0;c.ease=Math.max(1.3,c.ease-0.2);c.lapses=(c.lapses||0)+1;c.reps=0;c.due=t;
  }
  progress.cards[w.word]=c;
  bumpStreak();
  progress.stats.todayWords=progress.stats.todayWords||[];
  if(!progress.stats.todayWords.includes(w.word))progress.stats.todayWords.push(w.word);
  progress.stats.reviewedToday=(progress.stats.reviewedToday||0)+1;
  save();
  $("#streakNum").textContent=progress.stats.streak||0;
}

/* ===== 完成态 ===== */
function renderDone(){
  $("#main").innerHTML=`
    <div class="done">
      <div class="emoji">🎉</div>
      <h2>今日任务完成</h2>
      <p>新词 ${(progress.stats.todayWords||[]).length} 个 · 复习 ${progress.stats.reviewedToday||0} 个<br>明天再来巩固，记忆更牢</p>
      <button class="btn primary" onclick="renderMenu()">查看今日计划</button>
    </div>`;
  updateBadge();
}
function updateBadge(){
  const due=pickDue().length;
  const b=$("#badgeStudy");
  if(due>0){b.style.display="grid";b.textContent=due;}else{b.style.display="none";}
}

/* ---------- 单词本 ---------- */
let curCat="全部",curQuery="";
function renderList(){
  const main=$("#main");
  const chips=CATS.map(c=>`<div class="chip ${c===curCat?"on":""}" onclick="setCat('${c}')">${c}</div>`).join("");
  main.innerHTML=`
    <div class="searchbar"><input id="search" placeholder="搜索单词 / 释义…" value="${esc(curQuery)}" oninput="onSearch(this.value)"></div>
    <div class="chips">${chips}</div>
    <ul class="wordlist" id="list"></ul>`;
  renderListItems();
}
function renderListItems(){
  const q=curQuery.trim().toLowerCase();
  const list=[];
  for(const w of WORDS){
    if(curCat!=="全部"&&w.category!==curCat)continue;
    if(q&&!(w.word.toLowerCase().includes(q)||w.zh.includes(q)||(w.def||"").toLowerCase().includes(q)))continue;
    list.push(w);
  }
  const ul=$("#list");
  if(list.length===0){ul.innerHTML='<div class="empty">没有匹配的单词</div>';return;}
  ul.innerHTML=list.map(w=>{
    const st=cardState(w);
    const dot={new:"new",learn:"learn",review:"review",master:"master"}[st];
    return `<li class="worditem" onclick="openDetail('${esc(w.word)}')">
      <span class="dot ${dot}"></span>
      <span class="w">${esc(w.word)}</span>
      <span class="z">${esc(w.zh)}</span></li>`;
  }).join("");
}
function setCat(c){curCat=c;renderList();}
function onSearch(v){curQuery=v;renderListItems();}
function openDetail(word){
  const w=WORDS.find(x=>x.word===word);if(!w)return;
  const c=progress.cards[w.word];
  const stTxt={new:"未学习",learn:"学习中",review:"待复习",master:"已掌握"}[cardState(w)];
  const interval=c?c.interval:0;
  const due=c&&c.due?c.due:"—";
  $("#main").innerHTML=`
    <div class="topbar">
      <button class="backbtn" onclick="renderList()">← 返回</button>
      <div class="t">单词详情</div>
    </div>
    <div class="qcard">
      <div class="qword" style="font-size:30px">${esc(w.word)}</div>
      <div class="qipa">${w.ipa?"/"+esc(w.ipa)+"/":""}</div>
      <div class="speakrow"><button class="speak" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}')">🔊</button></div>
      <div class="zh">${esc(w.zh)}</div>
      <div class="detail"><span class="k">定义</span>${esc(w.def||"")}</div>
      ${w.example?`<div class="example"><span class="k" style="color:var(--muted);font-size:12px">🎧 例子</span>${esc(w.example)}</div>`:""}
      <div style="color:var(--faint);font-size:12px;margin-top:6px">${esc(w.category)} · ${stTxt} · 间隔 ${interval} 天 · 下次 ${due}</div>
    </div>`;
}

/* ---------- 我的 ---------- */
function renderMe(){
  const main=$("#main");
  const total=WORDS.length;
  const studied=WORDS.filter(w=>progress.cards[w.word]).length;
  const mastered=mastered();
  const due=pickDue().length;
  const s=progress.settings.dailyNew||10;
  const seg=(n)=>`<span class="seg ${s===n?"on":""}" onclick="setDaily(${n})">${n}</span>`;
  main.innerHTML=`
    <div class="overview" style="margin-top:6px">
      <div class="stat"><div class="num">${total}</div><div class="lbl">总词数</div></div>
      <div class="stat"><div class="num accent">${studied}</div><div class="lbl">已学习</div></div>
      <div class="stat"><div class="num">${mastered}</div><div class="lbl">已掌握</div></div>
      <div class="stat"><div class="num">${due}</div><div class="lbl">待复习</div></div>
    </div>
    <div class="panel">
      <h3>每日新词量</h3>
      <div class="setting"><span class="lbl">每天学新词</span><div class="val">${seg(5)}${seg(10)}${seg(15)}${seg(20)}</div></div>
    </div>
    <div class="panel">
      <h3>数据</h3>
      <div class="setting"><span class="lbl">连续学习</span><span style="color:#ffd58a;font-weight:700">🔥 ${progress.stats.streak||0} 天</span></div>
      <div class="setting"><span class="lbl">今日新词</span><span>${(progress.stats.todayWords||[]).length} 个</span></div>
      <div class="setting"><span class="lbl">今日复习</span><span>${progress.stats.reviewedToday||0} 个</span></div>
    </div>
    <div class="panel">
      <h3>学习进度备份</h3>
      <button class="btn" onclick="exportData()">导出进度（复制到剪贴板）</button>
      <button class="btn" onclick="importData()">导入进度</button>
      <button class="btn warn" onclick="resetData()">重置全部进度</button>
    </div>
    <div style="color:var(--faint);font-size:12px;text-align:center;padding:10px 0 20px">单词来源：Obsidian 火火知识库 · 英语学习</div>`;
}
function setDaily(n){progress.settings.dailyNew=n;save();renderMe();}
function exportData(){navigator.clipboard.writeText(JSON.stringify(progress)).then(()=>alert("已复制，可粘贴保存到笔记"));}
function importData(){const t=prompt("粘贴导出的进度 JSON：");if(!t)return;try{const p=JSON.parse(t);if(!p.cards)throw 0;progress=p;save();renderMe();alert("导入成功");}catch(e){alert("格式不对");}}
function resetData(){if(confirm("确定清空所有学习进度？单词数据不会丢。")){progress={cards:{},settings:{dailyNew:10},stats:{}};save();renderMe();}}

/* ---------- 导航 ---------- */
let tab="study";
function switchTab(t){
  tab=t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  if(t==="study")renderStudy();
  else if(t==="list")renderList();
  else renderMe();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ---------- 启动 ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
save();
switchTab("study");
</script>
